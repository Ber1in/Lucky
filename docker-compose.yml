services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dlt}
      POSTGRES_USER: ${POSTGRES_USER:-dlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dlt}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dlt} -d ${POSTGRES_DB:-dlt}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    image: lucky-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dlt:dlt@db:5432/dlt}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: lucky-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dlt:dlt@db:5432/dlt}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      TZ: Asia/Shanghai
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.worker

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
